apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-extract-embeddings-INITIALS
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extract
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -e
            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            mkdir -p data && ln -s /data/JetClass/Pythia/train_100M data/train_100M

            mkdir -p models/JetClassII_Sophon
            curl -fSL -o models/JetClassII_Sophon/model.pt \
              "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

            PYTHONUNBUFFERED=1 python3 inference_all_classes.py \
              --checkpoint models/JetClassII_Sophon/model.pt \
              --root-dir data/train_100M \
              --events-per-class 0 \
              --output-dir embeddings_pretrained_full \
              --format npy

            cp -r embeddings_pretrained_full /data/embeddings_pretrained_full
        volumeMounts:
        - { name: pvc, mountPath: /data }
        resources:
          requests: { memory: "32Gi", cpu: "2", nvidia.com/gpu: "1" }
          limits:   { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1" }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
