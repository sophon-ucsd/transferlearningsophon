apiVersion: batch/v1
kind: Job
metadata:
  name: umap-ft-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: umap-ft
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install umap-learn scikit-learn matplotlib scipy

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          echo "=== Extracting embeddings from full_ft 3M seed=42 ==="
          PYTHONUNBUFFERED=1 python3 scripts/extract_embeddings_ft.py \
            --checkpoint /data/results/full_ft/full_ft_3000000_42/best_model.pt \
            --pretrained-checkpoint models/JetClassII_Sophon/model.pt \
            --features-dir /data/features/val_5M \
            --output-dir /data/embeddings_ft_full_3M_seed42 \
            --max-per-class 5000

          echo "=== Running UMAP + distance matrix ==="
          PYTHONUNBUFFERED=1 python3 scripts/embedding_geometry.py \
            --embeddings-dir /data/embeddings_ft_full_3M_seed42 \
            --output-dir /data/results/figures/umap_full_ft_3M_seed42 \
            --n-per-class 5000
        resources:
          requests:
            memory: "24Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "24Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
