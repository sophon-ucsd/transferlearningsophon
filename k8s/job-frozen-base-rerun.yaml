apiVersion: batch/v1
kind: Job
metadata:
  name: frozen-rerun-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn

          PYTHONUNBUFFERED=1 python3 scripts/run_frozen_base.py \
            --train-dir /data/embeddings_pretrained_full_02_174909_100M \
            --val-dir /data/embeddings_val_5M \
            --test-dir /data/embeddings_test_20M \
            --output-dir /data/results/frozen_base \
            --sizes 10000,30000,100000,300000,1000000 \
            --epochs 500 \
            --patience 10
        resources:
          requests:
            memory: "64Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "64Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "32Gi"
