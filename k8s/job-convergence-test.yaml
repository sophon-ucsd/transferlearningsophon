apiVersion: batch/v1
kind: Job
metadata:
  name: convergence-test-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install hydra-core omegaconf torchmetrics pytorch-lightning

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          # Test each strategy at 100K jets, 200 epochs, patience=200 (no early stop)
          for STRATEGY in from_scratch full_ft partial_ft; do
            echo "=========================================="
            echo "=== CONVERGENCE TEST: $STRATEGY ==="
            echo "=========================================="

            if [ "$STRATEGY" = "from_scratch" ]; then
              CKPT="transfer.checkpoint=null"
              LR="training.optimizer.lr=1e-3"
              EXTRA=""
            elif [ "$STRATEGY" = "full_ft" ]; then
              CKPT="transfer.checkpoint=models/JetClassII_Sophon/model.pt"
              LR="training.optimizer.lr=1e-3"
              EXTRA="transfer.backbone_lr=1e-4"
            elif [ "$STRATEGY" = "partial_ft" ]; then
              CKPT="transfer.checkpoint=models/JetClassII_Sophon/model.pt"
              LR="training.optimizer.lr=5e-4"
              EXTRA="transfer.frozen_layers=4"
            fi

            PYTHONUNBUFFERED=1 python3 scripts/train_sophon.py \
              transfer.strategy=$STRATEGY \
              $CKPT \
              $LR \
              $EXTRA \
              data.train_dir=/data/JetClass/Pythia/train_100M \
              data.val_dir=/data/JetClass/Pythia/val_5M \
              data.test_dir=/data/JetClass/Pythia/test_20M \
              data.train_size=100000 \
              data.batch_size=256 \
              data.num_workers=4 \
              training.max_epochs=200 \
              training.early_stopping_patience=200 \
              project.seed=42 \
              sweep_name=convergence_test \
              logging.results_dir=/data/results \
              logging.wandb_project=null
          done
          echo "ALL CONVERGENCE TESTS DONE"
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
