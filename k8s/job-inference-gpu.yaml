apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-inference-job
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: sophon-runner
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Cloning the repository..."
            git clone https://github.com/sophon-ucsd/transferlearningsophon.git
            cd transferlearningsophon

            echo "Installing missing dependencies..."
            pip install uproot awkward numpy tqdm

            echo "Linking JetClass dataset..."
            mkdir -p data/JetClass
            ln -s /workspace/data/jetclass2 data/JetClass/val_5M

            # Download pretrained weights from HuggingFace (too large for GitHub)
            echo "Downloading pretrained Sophon weights..."
            mkdir -p models/JetClassII_Sophon
            curl -fSL -o models/JetClassII_Sophon/model.pt \
              "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"
            echo "Downloaded model.pt ($(du -h models/JetClassII_Sophon/model.pt | cut -f1))"

            # -----------------------------------------------------------------
            # PRETRAINED INFERENCE
            # -----------------------------------------------------------------
            echo "===== Step 1: Pretrained Inference ====="
            python inference_all_classes.py \
              --checkpoint models/JetClassII_Sophon/model.pt
            mv embeddings embeddings_pretrained

            # -----------------------------------------------------------------
            # PRETRAINED SWEEP (MLP + baseline evaluation)
            # -----------------------------------------------------------------
            echo "===== Step 2: Pretrained Sweep ====="
            python scripts/run_sweep.py \
              --sweep arch \
              --emb-dir embeddings_pretrained/ \
              --out-dir results/pretrained/arch_sweep/

            python scripts/run_sweep.py \
              --sweep size \
              --emb-dir embeddings_pretrained/ \
              --out-dir results/pretrained/size_sweep/

            python scripts/evaluate_baseline.py \
              --emb-dir embeddings_pretrained/ \
              --out-dir results/pretrained/

            # -----------------------------------------------------------------
            # RANDOM-INIT INFERENCE (no --checkpoint = random weights)
            # -----------------------------------------------------------------
            echo "===== Step 3: Random-Init Inference ====="
            python inference_all_classes.py
            mv embeddings embeddings_random

            # -----------------------------------------------------------------
            # RANDOM-INIT SWEEP
            # -----------------------------------------------------------------
            echo "===== Step 4: Random-Init Sweep ====="
            python scripts/run_sweep.py \
              --sweep arch \
              --emb-dir embeddings_random/ \
              --out-dir results/random_init/arch_sweep/

            python scripts/run_sweep.py \
              --sweep size \
              --emb-dir embeddings_random/ \
              --out-dir results/random_init/size_sweep/

            python scripts/evaluate_baseline.py \
              --emb-dir embeddings_random/ \
              --out-dir results/random_init/

            # -----------------------------------------------------------------
            # COMPARISON PLOTS
            # -----------------------------------------------------------------
            echo "===== Step 5: Comparison Plots ====="
            python scripts/plot_results.py \
              --plot-type comparison \
              --mlp-results results/pretrained/arch_sweep/arch_sweep_results.csv \
              --baseline-results results/random_init/arch_sweep/arch_sweep_results.csv \
              --out-dir results/comparison/

            echo "Saving results to Persistent Volume..."
            cp -r embeddings_pretrained /workspace/data/
            cp -r embeddings_random /workspace/data/
            cp -r results /workspace/data/

            echo "===== ALL DONE ====="
            echo "Pretrained results:  results/pretrained/"
            echo "Random-init results: results/random_init/"
            echo "Comparison plots:    results/comparison/"
        volumeMounts:
        - name: data-volume
          mountPath: /workspace/data
        resources:
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: transfer-learning-vol
