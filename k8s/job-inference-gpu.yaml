apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-inference-job
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            echo "Cloning the repository..."
            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            echo "Installing missing dependencies..."
            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            echo "Linking JetClass dataset..."
            mkdir -p data
            ln -s /data/JetClass2 data/val_5M

            # download pretrained weights (too large for git)
            echo "Downloading pretrained Sophon weights..."
            mkdir -p models/JetClassII_Sophon
            curl -fSL -o models/JetClassII_Sophon/model.pt \
              "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"
            echo "Downloaded model.pt ($(du -h models/JetClassII_Sophon/model.pt | cut -f1))"

            # pretrained inference
            echo "Running pretrained inference..."
            python inference_all_classes.py \
              --checkpoint models/JetClassII_Sophon/model.pt
            mv embeddings embeddings_pretrained

            # pretrained sweeps (arch + size, baseline runs as part of size sweep)
            echo "Running pretrained sweeps..."
            python scripts/run_sweep.py \
              --sweep arch \
              --emb-dir embeddings_pretrained/ \
              --out-dir results/pretrained/arch_sweep/

            python scripts/run_sweep.py \
              --sweep size \
              --emb-dir embeddings_pretrained/ \
              --out-dir results/pretrained/size_sweep/

            # random-init inference (no checkpoint = random weights)
            echo "Running random-init inference..."
            python inference_all_classes.py
            mv embeddings embeddings_random

            # random-init sweeps
            echo "Running random-init sweeps..."
            python scripts/run_sweep.py \
              --sweep arch \
              --emb-dir embeddings_random/ \
              --out-dir results/random_init/arch_sweep/

            python scripts/run_sweep.py \
              --sweep size \
              --emb-dir embeddings_random/ \
              --out-dir results/random_init/size_sweep/

            # comparison plots
            echo "Generating comparison plots..."
            python scripts/plot_results.py \
              --plot-type comparison \
              --mlp-results results/pretrained/arch_sweep/medium/train_results.csv \
              --baseline-results results/pretrained/size_sweep/baseline/baseline_results.csv \
              --out-dir results/comparison/

            # save everything to the persistent volume
            echo "Saving results to PV..."
            cp -r embeddings_pretrained /data/
            cp -r embeddings_random /data/
            cp -r results /data/

            echo "Done!"
        volumeMounts:
        - mountPath: /data
          name: pvc
        resources:
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
