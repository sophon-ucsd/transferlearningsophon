apiVersion: batch/v1
kind: Job
metadata:
  name: probing-audits-12-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: audits
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn pyarrow

          mkdir -p /data/results/poster/probing_audits

          # Audit 1 (residualized) is highest-leverage; runs first inside the script.
          # Audit 2 (per-class) runs second. Audit 4 deferred (needs MLP CSV).
          PYTHONUNBUFFERED=1 python3 scripts/probing_audits.py \
            --observables /data/results/poster/observables_test_100k.parquet \
            --pretrained-dir /data/embeddings_test_20M \
            --finetuned-dir  /data/embeddings_ft_full_3M_seed42_test100k \
            --finetune-label "full_ft_3M_seed42" \
            --output-dir /data/results/poster/probing_audits \
            --n-per-class 10000 \
            --n-bootstrap 100 \
            --seed 42 \
            --audits 1,2
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
