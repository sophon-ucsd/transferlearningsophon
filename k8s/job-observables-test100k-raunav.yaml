apiVersion: batch/v1
kind: Job
metadata:
  name: observables-test100k-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: observables
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install uproot pyarrow

          mkdir -p /data/results/poster

          PYTHONUNBUFFERED=1 python3 scripts/compute_substructure.py \
            --data-dir /data/JetClass/Pythia/test_20M \
            --output /data/results/poster/observables_test_100k.npz \
            --n-jets 100000 \
            --seed 42
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
