apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-size-sweep-YOUR_INITIALS
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -e
            START_TIME=$(date +%s)
            TAG=$(date +%d_%H%M%S)_100M

            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            if [ ! -d /data/embeddings_pretrained_full ]; then
              echo "ERROR: /data/embeddings_pretrained_full not found. Run job-1 first."
              exit 1
            fi

            python3 scripts/run_sweep.py \
              --sweep size \
              --emb-dir /data/embeddings_pretrained_full/ \
              --out-dir results/size_sweep/ \
              --hidden-layers 256,128,64 \
              --epochs 50 \
              --batch-size 8192 \
              --patience 10 \
              2>&1 | tee size_sweep_log.txt

            OUTPUT_DIR="/data/results/size_sweep_${TAG}"
            mkdir -p "$OUTPUT_DIR"
            cp -r results/size_sweep/* "$OUTPUT_DIR/"
            cp size_sweep_log.txt "$OUTPUT_DIR/"
            echo "Output saved to: $OUTPUT_DIR"

            END_TIME=$(date +%s)
            ELAPSED=$(( END_TIME - START_TIME ))
            echo "Done in $(( ELAPSED / 3600 ))h $(( (ELAPSED % 3600) / 60 ))m"
        volumeMounts:
        - mountPath: /data
          name: pvc
        resources:
          limits:
            memory: "128Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
          requests:
            memory: "64Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol