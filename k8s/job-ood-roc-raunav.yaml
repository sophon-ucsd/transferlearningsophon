apiVersion: batch/v1
kind: Job
metadata:
  name: ood-roc-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ood
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn pyarrow matplotlib

          mkdir -p /data/results/poster

          PYTHONUNBUFFERED=1 python3 scripts/ood_holdout_roc.py \
            --pretrained-dir /data/embeddings_test_20M \
            --observables /data/results/poster/observables_test_100k.parquet \
            --output-dir /data/results/poster \
            --n-per-class 10000 \
            --seed 42
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
