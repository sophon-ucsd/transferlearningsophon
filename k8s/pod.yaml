apiVersion: v1
kind: Pod
metadata:
  name: rm-sophon-pod
  namespace: cms-ml
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
    command: ["sleep", "infinity"]
    volumeMounts:
    - mountPath: /data
      name: pvc
    resources:
      limits:
        memory: "16Gi"
        cpu: "4"
        nvidia.com/gpu: "1"
      requests:
        memory: "8Gi"
        cpu: "2"
        nvidia.com/gpu: "1"
  volumes:
  - name: pvc
    persistentVolumeClaim:
      claimName: transfer-learning-vol
