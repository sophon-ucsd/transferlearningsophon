apiVersion: v1
kind: Pod
metadata:
  name: raunav-sophon-pod
  namespace: cms-ml
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
    command: ["sleep", "infinity"]
    volumeMounts:
    - mountPath: /data
      name: pvc
    resources:
      limits:
        memory: "4Gi"
        cpu: "2"
      requests:
        memory: "2Gi"
        cpu: "1"
  volumes:
  - name: pvc
    persistentVolumeClaim:
      claimName: transfer-learning-vol
