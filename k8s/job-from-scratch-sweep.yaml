apiVersion: batch/v1
kind: Job
metadata:
  name: from-scratch-sweep-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install hydra-core omegaconf torchmetrics pytorch-lightning

          mkdir -p /data/results/from_scratch

          for SIZE in 10000 30000 100000 300000 1000000 3000000 10000000 30000000 100000000; do
            for SEED in 42 123 456; do
              echo "=== from_scratch SIZE=$SIZE SEED=$SEED ==="
              PYTHONUNBUFFERED=1 python3 scripts/train_sophon.py \
                transfer.strategy=from_scratch \
                transfer.checkpoint=null \
                data.train_dir=/data/JetClass/Pythia/train_100M \
                data.val_dir=/data/JetClass/Pythia/val_5M \
                data.test_dir=/data/JetClass/Pythia/test_20M \
                data.train_size=$SIZE \
                data.batch_size=512 \
                data.num_workers=4 \
                training.optimizer.lr=1e-3 \
                training.max_epochs=30 \
                training.early_stopping_patience=10 \
                project.seed=$SEED \
                sweep_name=from_scratch \
                logging.wandb_project=null \
                logging.results_dir=/data/results \
                2>&1 | tail -5

            done
          done
          echo "ALL DONE"
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
