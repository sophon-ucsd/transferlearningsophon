apiVersion: batch/v1
kind: Job
metadata:
  name: extract-partial-test100k-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extract-partial
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          # Extract partial-FT (3M, seed=42) embeddings on 10K test jets per class = 100K total
          PYTHONUNBUFFERED=1 python3 scripts/extract_embeddings_ft.py \
            --checkpoint /data/results/partial_ft/partial_ft_3000000_42/best_model.pt \
            --pretrained-checkpoint models/JetClassII_Sophon/model.pt \
            --features-dir /data/features/test_20M \
            --output-dir /data/embeddings_partial_ft_3M_seed42_test100k \
            --max-per-class 10000
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
