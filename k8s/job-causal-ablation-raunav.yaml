apiVersion: batch/v1
kind: Job
metadata:
  name: causal-ablation-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ablation
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          mkdir -p /data/results/poster

          PYTHONUNBUFFERED=1 python3 scripts/causal_ablation_d0.py \
            --pretrained-checkpoint models/JetClassII_Sophon/model.pt \
            --frozen-mlp /data/results/frozen_base/frozen_base_100000000_42/best_model.pt \
            --features-dir /data/features/test_20M \
            --output /data/results/poster/causal_ablation_results.csv \
            --n-per-class 10000 \
            --batch-size 512
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
