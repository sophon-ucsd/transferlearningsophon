apiVersion: batch/v1
kind: Job
metadata:
  name: preprocess-features-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: preprocess
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install uproot awkward

          echo "=== Processing train_100M ==="
          PYTHONUNBUFFERED=1 python3 scripts/preprocess_root_to_npy.py \
            --input-dir /data/JetClass/Pythia/train_100M \
            --output-dir /data/features/train_100M

          echo "=== Processing val_5M ==="
          PYTHONUNBUFFERED=1 python3 scripts/preprocess_root_to_npy.py \
            --input-dir /data/JetClass/Pythia/val_5M \
            --output-dir /data/features/val_5M

          echo "=== Processing test_20M ==="
          PYTHONUNBUFFERED=1 python3 scripts/preprocess_root_to_npy.py \
            --input-dir /data/JetClass/Pythia/test_20M \
            --output-dir /data/features/test_20M

          echo "ALL DONE"
        resources:
          requests:
            memory: "32Gi"
            cpu: "8"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
