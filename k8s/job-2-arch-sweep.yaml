apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-arch-sweep-YOUR_INITIALS
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -e
            START_TIME=$(date +%s)

            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            if [ ! -d /data/embeddings_pretrained_full ]; then
              echo "ERROR: /data/embeddings_pretrained_full not found. Run job-1 first."
              exit 1
            fi

            python3 scripts/run_sweep.py \
              --sweep arch \
              --emb-dir /data/embeddings_pretrained_full/ \
              --out-dir results/arch_sweep/ \
              --per-class-cap 1000000 \
              --epochs 50 \
              --batch-size 8192 \
              2>&1 | tee arch_sweep_log.txt

            mkdir -p /data/results
            cp -r results/arch_sweep /data/results/
            cp arch_sweep_log.txt /data/results/arch_sweep/

            END_TIME=$(date +%s)
            ELAPSED=$(( END_TIME - START_TIME ))
            echo "Done in $(( ELAPSED / 3600 ))h $(( (ELAPSED % 3600) / 60 ))m"
        volumeMounts:
        - mountPath: /data
          name: pvc
        resources:
          limits:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
