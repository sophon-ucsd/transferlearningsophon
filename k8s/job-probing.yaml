apiVersion: batch/v1
kind: Job
metadata:
  name: probing-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn

          echo "=== Matched substructure probing ==="
          PYTHONUNBUFFERED=1 python3 scripts/probe_matched.py \
            --root-dir /data/JetClass/Pythia/val_5M \
            --emb-dir /data/embeddings_val_5M \
            --output /data/results/probing_results.json \
            --n-per-class 5000

          echo "=== Generate plots ==="
          python3 scripts/plot_probing.py \
            /data/results/probing_results.json \
            --output-dir /data/results/figures/

          echo "DONE"
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "4"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
