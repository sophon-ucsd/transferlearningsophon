apiVersion: batch/v1
kind: Job
metadata:
  name: umap-compare-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: umap-compare
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install umap-learn scikit-learn matplotlib scipy

          PYTHONUNBUFFERED=1 python3 scripts/plot_umap_comparison.py \
            --pretrained-dir /data/embeddings_val_5M \
            --finetuned-dir /data/embeddings_ft_full_3M_seed42 \
            --finetune-label "Full FT, 3M jets, seed=42" \
            --output /data/results/figures/umap_compare_full_ft_3M.pdf \
            --n-per-class 3000
        resources:
          requests:
            memory: "24Gi"
            cpu: "4"
          limits:
            memory: "24Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
