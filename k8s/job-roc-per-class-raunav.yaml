apiVersion: batch/v1
kind: Job
metadata:
  name: roc-per-class-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: roc
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn matplotlib

          mkdir -p /data/results/poster

          PYTHONUNBUFFERED=1 python3 scripts/plot_roc_per_class.py \
            --mlp /data/results/frozen_base/frozen_base_100000000_42/best_model.pt \
            --embeddings-dir /data/embeddings_test_20M \
            --n-per-class 10000 \
            --seed 42 \
            --output /data/results/poster/roc_per_class
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
