apiVersion: batch/v1
kind: Job
metadata:
  name: umap-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: umap
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install umap-learn scikit-learn matplotlib scipy

          PYTHONUNBUFFERED=1 python3 scripts/embedding_geometry.py \
            --embeddings-dir /data/embeddings_val_5M \
            --output-dir /data/results/figures/umap_val5M \
            --n-per-class 5000
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
