apiVersion: batch/v1
kind: Job
metadata:
  name: frozen-sweep-v3-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn

          python3 scripts/run_frozen_sweep.py \
            --train-dir /data/embeddings_pretrained_full_02_174909_100M \
            --val-dir /data/embeddings_val_5M \
            --test-dir /data/embeddings_test_20M \
            --output-dir /data/results/frozen_sweep_v3

          echo "DONE"
        resources:
          requests:
            memory: "64Gi"
            cpu: "4"
          limits:
            memory: "64Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
