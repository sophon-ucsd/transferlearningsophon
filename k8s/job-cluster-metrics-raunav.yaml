apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-metrics-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cluster-metrics
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn matplotlib

          mkdir -p /data/results/poster

          PYTHONUNBUFFERED=1 python3 scripts/cluster_metrics.py \
            --pretrained-dir /data/embeddings_test_20M \
            --finetuned-dir /data/embeddings_ft_full_3M_seed42_test100k \
            --finetune-label "Full FT 3M, seed=42" \
            --output-dir /data/results/poster \
            --n-per-class 10000 \
            --seed 42
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
