apiVersion: batch/v1
kind: Job
metadata:
  name: frozen-sweep-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn hydra-core omegaconf torchmetrics

          mkdir -p /data/results/frozen_sweep

          for SIZE in 10000 30000 100000 300000 1000000 3000000 10000000; do
            for SEED in 42 123 456; do
              echo "=== frozen SIZE=$SIZE SEED=$SEED ==="
              python3 scripts/train_frozen_mlp.py \
                --embeddings-dir /data/embeddings_pretrained_full_02_174909_100M \
                --train-size $SIZE --seed $SEED --epochs 50 --patience 10 \
                --output-dir /data/results/frozen_sweep/frozen_${SIZE}_${SEED}
            done
          done
          echo "ALL DONE"
        resources:
          requests:
            memory: "64Gi"
            cpu: "4"
          limits:
            memory: "64Gi"
            cpu: "8"
        volumeMounts:
        - name: pvc
          mountPath: /data
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
