apiVersion: batch/v1
kind: Job
metadata:
  name: roc-3strategies-10m-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: roc-and-extract
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          pip install scikit-learn matplotlib

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          mkdir -p /data/results/poster

          # Step 1: Extract full-FT-10M test embeddings (for the new UMAP)
          echo "=== Extracting full-FT-10M test embeddings ==="
          PYTHONUNBUFFERED=1 python3 scripts/extract_embeddings_ft.py \
            --checkpoint /data/results/full_ft/full_ft_10000000_42/best_model.pt \
            --pretrained-checkpoint models/JetClassII_Sophon/model.pt \
            --features-dir /data/features/test_20M \
            --output-dir /data/embeddings_ft_full_10M_seed42_test100k \
            --max-per-class 10000

          # Step 2: 3-strategy per-class ROC at 10M
          echo "=== Computing ROC for all three 10M strategies ==="
          PYTHONUNBUFFERED=1 python3 scripts/plot_roc_3strategies.py \
            --frozen-mlp /data/results/frozen_base/frozen_base_10000000_42/best_model.pt \
            --partial-ckpt /data/results/partial_ft/partial_ft_10000000_42/best_model.pt \
            --full-ckpt /data/results/full_ft/full_ft_10000000_42/best_model.pt \
            --pretrained models/JetClassII_Sophon/model.pt \
            --features-dir /data/features/test_20M \
            --embeddings-dir /data/embeddings_test_20M \
            --n-per-class 10000 \
            --batch-size 512 \
            --seed 42 \
            --output /data/results/poster/roc_3strategies_10M
        resources:
          requests:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
