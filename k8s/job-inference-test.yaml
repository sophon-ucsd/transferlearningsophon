apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-inference-test-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          START_TIME=$(date +%s)

          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

          mkdir -p data
          ln -s /data/JetClass/Pythia/test_20M data/test_20M

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          python3 inference_all_classes.py \
            --checkpoint models/JetClassII_Sophon/model.pt \
            --root-dir data/test_20M \
            --events-per-class 0 \
            --output-dir embeddings_test \
            --format npy \
            2>&1 | tee inference_test_log.txt

          mkdir -p /data/embeddings_test_20M
          cp embeddings_test/*.npy /data/embeddings_test_20M/
          cp inference_test_log.txt /data/embeddings_test_20M/

          END_TIME=$(date +%s)
          ELAPSED=$(( END_TIME - START_TIME ))
          echo "Done in $(( ELAPSED / 3600 ))h $(( (ELAPSED % 3600) / 60 ))m"
        resources:
          requests:
            memory: "16Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
