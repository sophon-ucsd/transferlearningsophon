apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-inference-test-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -e
            START_TIME=$(date +%s)

            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            mkdir -p data
            ln -s /data/JetClass/Pythia/train_100M data/train_100M

            mkdir -p models/JetClassII_Sophon
            curl -fSL -o models/JetClassII_Sophon/model.pt \
              "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

            # Test run: 100 events per class (1000 total)
            python3 inference_all_classes.py \
              --checkpoint models/JetClassII_Sophon/model.pt \
              --root-dir data/train_100M \
              --events-per-class 100 \
              --output-dir embeddings_test \
              --format npy \
              2>&1 | tee inference_test_log.txt

            echo "=== Checking outputs ==="
            ls -la embeddings_test/
            python3 -c "
            import numpy as np, glob
            for f in sorted(glob.glob('embeddings_test/*.npy')):
                a = np.load(f)
                print(f'{f}: shape={a.shape}, dtype={a.dtype}, nonzero={(a != 0).any()}')
            "

            END_TIME=$(date +%s)
            ELAPSED=$(( END_TIME - START_TIME ))
            echo "Done in $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"
        volumeMounts:
        - mountPath: /data
          name: pvc
        resources:
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
