apiVersion: batch/v1
kind: Job
metadata:
  name: sophon-inference-YOUR_INITIALS
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: shell
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -e
            START_TIME=$(date +%s)

            git clone https://github.com/raunavm/transferlearningsophon.git
            cd transferlearningsophon

            pip install uproot awkward numpy tqdm scikit-learn pandas matplotlib

            mkdir -p data
            ln -s /data/JetClass/Pythia/train_100M data/train_100M

            mkdir -p models/JetClassII_Sophon
            curl -fSL -o models/JetClassII_Sophon/model.pt \
              "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

            python3 inference_all_classes.py \
              --checkpoint models/JetClassII_Sophon/model.pt \
              --root-dir data/train_100M \
              --events-per-class 0 \
              --output-dir embeddings_pretrained_full \
              --format npy \
              2>&1 | tee inference_log.txt

            cp -r embeddings_pretrained_full /data/
            cp inference_log.txt /data/embeddings_pretrained_full/

            END_TIME=$(date +%s)
            ELAPSED=$(( END_TIME - START_TIME ))
            echo "Done in $(( ELAPSED / 3600 ))h $(( (ELAPSED % 3600) / 60 ))m"
        volumeMounts:
        - mountPath: /data
          name: pvc
        resources:
          limits:
            memory: "128Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
          requests:
            memory: "64Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
