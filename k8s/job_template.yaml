apiVersion: batch/v1
kind: Job
metadata:
  name: {{JOB_NAME}}
  namespace: cms-ml
  labels:
    sweep: {{SWEEP_NAME}}
    app: transfer-scaling-jets
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{TIMEOUT}}
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Job: {{JOB_NAME}}"
          echo "Overrides: {{HYDRA_OVERRIDES}}"

          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          pip install hydra-core omegaconf torchmetrics pytorch-lightning

          python3 scripts/train_sophon.py {{HYDRA_OVERRIDES}} \
            data.data_dir=/data/JetClass/Pythia/train_100M \
            transfer.checkpoint=/data/transferlearningsophon/models/JetClassII_Sophon/model.pt \
            sweep_name={{SWEEP_NAME}} \
            logging.wandb_project=null \
            2>&1 | tee /data/results/{{SWEEP_NAME}}/{{JOB_NAME}}.log

          echo "Done: {{JOB_NAME}}"
        resources:
          requests:
            memory: {{MEMORY}}
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: {{MEMORY}}
            cpu: {{CPU}}
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: pvc
          mountPath: /data
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
