apiVersion: batch/v1
kind: Job
metadata:
  # Customize the suffix to identify the run, e.g. full-ft-30m-s42-INITIALS
  name: train-sweep-INITIALS
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          mkdir -p models/JetClassII_Sophon
          curl -fSL -o models/JetClassII_Sophon/model.pt \
            "https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt"

          # Set STRATEGY, SIZE, SEED below. STRATEGY is one of: full_ft, partial_ft, frozen.
          PYTHONUNBUFFERED=1 python3 scripts/train_finetune_sweep.py \
            --train-dir /data/features/train_100M \
            --val-dir   /data/features/val_5M \
            --test-dir  /data/features/test_20M \
            --strategy  STRATEGY \
            --checkpoint models/JetClassII_Sophon/model.pt \
            --sizes  SIZE \
            --seeds  SEED \
            --lr 1e-3 \
            --backbone-lr 1e-4 \
            --output-dir /data/results/STRATEGY \
            --epochs 100 \
            --patience 10 \
            --batch-size 512 \
            --val-size 100000 \
            --test-size 500000 \
            --materialize-train \
            --skip-existing
        resources:
          requests: { memory: "256Gi", cpu: "6", nvidia.com/gpu: "1" }
          limits:   { memory: "256Gi", cpu: "8", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
