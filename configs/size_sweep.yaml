# Dataset size sweep configuration
sweep_type: size
emb_dir: embeddings/
out_dir: results/size_sweep/
epochs: 25
hidden_layers: [256, 128, 64]
seed: 1337

sizes:
  - 10000       # 100K total (10K/class)
  - 100000      # 1M total (100K/class)
  - 1000000     # 10M total (1M/class)
  - 10000000    # 100M total (10M/class)
  - 100000000   # 1B total (100M/class, full train_100M)
