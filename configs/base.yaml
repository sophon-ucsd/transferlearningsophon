project:
  name: transfer-scaling-jets
  seed: 42
  deterministic: false

model:
  num_classes: 10

data:
  dataset: jetclass
  data_dir: data/val_5M        # fallback: single dir, split internally
  train_dir: null              # official split: /data/JetClass/Pythia/train_100M
  val_dir: null                # official split: /data/JetClass/Pythia/val_5M
  test_dir: null               # official split: /data/JetClass/Pythia/test_20M
  num_particles: 128
  train_size: null
  val_size: null
  test_size: null
  batch_size: 512
  num_workers: 4

training:
  max_epochs: 50
  early_stopping_patience: 10
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.01
  scheduler:
    name: cosine
    warmup_epochs: 5
  gradient_clip_val: 1.0

transfer:
  strategy: frozen
  checkpoint: models/JetClassII_Sophon/model.pt
  head_type: mlp
  frozen_layers: 4
  backbone_lr: 1e-4

sweep_name: default

logging:
  wandb_project: transfer-scaling-jets
  wandb_entity: null
  log_every_n_steps: 50
