[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "transfer-scaling-jets"
version = "0.1.0"
description = "Transfer Learning Scaling Laws for Jet Classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "wandb",
    "hydra-core>=1.3",
    "omegaconf",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "h5py",
    "awkward",
    "uproot",
    "tqdm",
    "peft",
    "weaver-core>=0.4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
